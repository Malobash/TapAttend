spring.application.name=tapattend-backend
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5433/tapattend?sslmode=disable
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:tapattend}
spring.datasource.password=${DB_PASSWORD:malo001}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

